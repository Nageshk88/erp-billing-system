version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_billing
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erp_billing
      DB_USER: erp_user
      DB_PASS: erp_pass_2024
      JWT_SECRET: change_this_in_production_32chars_min
      NODE_ENV: production
    depends_on:
      - postgres

volumes:
  pgdata:
